workflows:
  store-screenshots:
    name: Shiftle — Store Screenshots
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 22
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Install screenshot browser
        script: npx playwright install chromium
      - name: Render App Store screenshots
        script: node tools/store-shots.mjs
    artifacts:
      - tools/out/store/*.png

  android-google-play:
    name: Shiftle — Android Google Play
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - shiftle_android_signing
      vars:
        PACKAGE_NAME: "com.nomarcus.shiftle"
      node: 22
      java: 21
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "release/android-store"
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Install dependencies
        script: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm ci

      - name: Create and sync the Android project
        script: |
          npx cap add android
          npx @capacitor/assets generate --android
          npm run android:sync

      - name: Configure Android release signing
        script: |
          mkdir -p "$CM_BUILD_DIR/.shiftle-signing"
          echo "$CM_SIGNING_BUNDLE_BASE64" | base64 --decode > /tmp/shiftle-signing.zip
          unzip -q /tmp/shiftle-signing.zip -d "$CM_BUILD_DIR/.shiftle-signing"

          python3 - <<'PY'
          import json
          from pathlib import Path

          signing_dir = Path.cwd() / ".shiftle-signing"
          password = (signing_dir / "keystore-password.txt").read_text().strip()
          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()
          text = text.replace(
              'android:exported="true">',
              'android:exported="true" android:screenOrientation="portrait">',
          )
          path.write_text(text)

          gradle = Path("android/app/build.gradle")
          text = gradle.read_text()
          signing = f'''    signingConfigs {{
                  release {{
                      storeFile file({json.dumps(str(signing_dir / "shiftle-upload.jks"))})
                      storePassword {json.dumps(password)}
                      keyAlias "shiftle_upload"
                      keyPassword {json.dumps(password)}
                  }}
              }}
          '''
          text = text.replace("        release {", "        release {\n            signingConfig signingConfigs.release")
          text = text.replace("    buildTypes {", signing + "    buildTypes {")
          gradle.write_text(text)
          PY

      - name: Set Android build number
        script: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path("android/app/build.gradle")
          text = path.read_text()
          text = text.replace("versionCode 1", f"versionCode {int(os.environ['BUILD_NUMBER'])}")
          path.write_text(text)
          PY

      - name: Build signed Android App Bundle
        script: |
          cd android
          ./gradlew bundleRelease

    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
      - android/app/build/reports/**
    publishing:
      email:
        recipients:
          - nomarcus@hotmail.com
        notify:
          success: true
          failure: true

  ios-testflight:
    name: Shiftle — iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Codemagic"
    environment:
      ios_signing:
        provisioning_profiles:
          - foraldrahjalpen_appstore_profile_apple
        certificates:
          - foraldrahjalpen_distribution
      vars:
        BUNDLE_ID: "com.nomarcus.shiftle"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "claude/simple-puzzle-game-iphone-ho2201"
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Install dependencies
        script: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm ci

      - name: Sync the committed iOS project
        script: npm run ios:sync

      - name: Set up App Store signing
        script: |
          set -euo pipefail

          json_first_id() {
            python3 -c 'import json, sys
          value = json.load(sys.stdin)
          def ids(node):
              if isinstance(node, dict):
                  if isinstance(node.get("id"), str):
                      yield node["id"]
                  for child in node.values():
                      yield from ids(child)
              elif isinstance(node, list):
                  for child in node:
                      yield from ids(child)
          print(next(ids(value), ""))'
          }

          keychain initialize

          BUNDLE_RESOURCE_ID="$(
            app-store-connect bundle-ids list \
              --bundle-id-identifier "$BUNDLE_ID" \
              --strict-match-identifier \
              --json | json_first_id
          )"
          if [ -z "$BUNDLE_RESOURCE_ID" ]; then
            BUNDLE_RESOURCE_ID="$(
              app-store-connect bundle-ids create "$BUNDLE_ID" \
                --name "Shiftle" \
                --platform IOS \
                --json | json_first_id
            )"
          fi

          CERTIFICATE_RESOURCE_ID="$(
            app-store-connect certificates list \
              --profile-type IOS_APP_STORE \
              --json | json_first_id
          )"

          PROFILE_RESOURCE_ID="$(
            app-store-connect bundle-ids profiles \
              --bundle-ids "$BUNDLE_RESOURCE_ID" \
              --type IOS_APP_STORE \
              --state ACTIVE \
              --json | json_first_id
          )"
          if [ -z "$PROFILE_RESOURCE_ID" ]; then
            app-store-connect profiles create "$BUNDLE_RESOURCE_ID" \
              --certificate-ids "$CERTIFICATE_RESOURCE_ID" \
              --type IOS_APP_STORE \
              --name "shiftle_appstore_profile" \
              --save
          else
            app-store-connect profiles get "$PROFILE_RESOURCE_ID" --save
          fi

          keychain add-certificates
          xcode-project use-profiles

      - name: Set build number
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Build the App Store archive
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "COMPILER_INDEX_STORE_ENABLE=NO"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
      email:
        recipients:
          - nomarcus@hotmail.com
        notify:
          success: true
          failure: true
