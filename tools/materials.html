<!doctype html>
<meta charset="utf-8">
<title>materials</title>
<body style="margin:0;background:#111">
<script type="module">
import { DEFAULT_SPEC } from "/src/engine/geometry.ts";
import { createBoard } from "/src/engine/board.ts";
import { cellIndex } from "/src/engine/geometry.ts";
import { computeLayout, drawBoard } from "/src/render/canvas.ts";
import { makeBackdropSheet, drawBackdropSheet } from "/src/render/backdrop.ts";
import { SKY } from "/src/render/theme.ts";
import { WORLDS, LAP_SPAN } from "/src/render/world.ts";
import { themeForDepth } from "/src/render/palette.ts";

const SPEC = DEFAULT_SPEC;
const STONE_FLAG = 32;

// A realistic mid-round board: mostly full, a few gaps, and stone on the rim so
// the threat can be compared against the reward at every tier.
function board(depth) {
  const b = createBoard(SPEC);
  for (let r = 0; r < SPEC.rings; r++) {
    for (let s = 0; s < SPEC.sectors; s++) {
      if ((r * 5 + s * 3) % 9 === 0) continue;
      b.cells[cellIndex(SPEC, r, s)] = ((s * 3 + r * 2) % 8) + 1;
    }
  }
  const outer = SPEC.rings - 1;
  for (const s of [1, 4, 8]) b.cells[cellIndex(SPEC, outer, s)] = STONE_FLAG;
  return b;
}

const W = 520, H = 520, DPR = 3;
window.__shots = [];

// One shot per world at its own opening depth, then the same worlds on a deeper
// lap, so both what a world looks like and what a lap does to it can be judged.
const SHOTS = [
  ...WORLDS.map((w) => ({ id: w.id, label: w.label, depth: w.from })),
  ...WORLDS.slice(0, 3).map((w) => ({ id: `lap2-${w.id}`, label: `${w.label} · lap 2`, depth: LAP_SPAN + w.from })),
];

for (const m of SHOTS) {
  const depth = m.depth;
  const canvas = document.createElement("canvas");
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  canvas.id = "m-" + m.id;
  document.body.append(canvas);
  const ctx = canvas.getContext("2d");
  ctx.scale(DPR, DPR);

  const cx = W / 2, cy = H / 2, radius = Math.min(W, H) * 0.435;
  // Exactly what the game does: the era's palette arrives by swapping the whole
  // theme, so the board, the tray and everything else stay in step.
  const theme = themeForDepth(SKY, depth);
  const sheet = makeBackdropSheet(W, H, theme, { x: cx, y: cy, radius }, depth);
  drawBackdropSheet(ctx, sheet, W, H, theme);
  drawBoard(ctx, board(depth), computeLayout(SPEC, cx, cy, radius), theme, 0, 0, depth);
  window.__shots.push({ id: m.id, label: m.label, depth });
}
window.__ready = true;
</script>
</body>
