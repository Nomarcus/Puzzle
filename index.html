<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#63CDFF" />
    <title>Shiftle</title>
    <style>
      :root {
        /* Parked here so the canvas layout can read them as plain numbers. */
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --font: "SF Pro Rounded", ui-rounded, -apple-system, system-ui, sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #2e9be8;
        font-family: var(--font);
        /* A puzzle game has nothing to select, and selection ruins dragging. */
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        touch-action: none;
      }

      /* Fills the window. The canvas caps the playable column itself, so the
         background can run edge to edge on a tablet instead of leaving bars. */
      #app {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }

      #board {
        display: block;
        width: 100%;
        height: 100%;
      }

      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: calc(var(--safe-top) + 24px) 26px calc(var(--safe-bottom) + 28px);
        text-align: center;
      }

      /* The menu sits under the spinning disc, which the canvas draws behind it. */
      .overlay.menu {
        justify-content: flex-end;
        gap: 12px;
        background: none;
      }

      /* Game over still needs to lift off the board behind it. */
      .overlay.result {
        background: rgba(255, 255, 255, 0.86);
      }

      /*
       * Twenty tiles are taller than a phone, so this one scrolls. Anchored to
       * the top rather than centred — a centred list that overflows crops
       * equally at both ends, which put the first tiles under the status bar.
       */
      .overlay.levels {
        justify-content: flex-start;
        overflow-y: auto;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
        padding-top: calc(var(--safe-top) + 68px);
        background: rgba(255, 255, 255, 0.93);
      }

      .overlay[hidden] {
        display: none;
      }

      .title {
        font-size: 60px;
        font-weight: 900;
        letter-spacing: -2px;
        line-height: 1;
        display: flex;
        filter: drop-shadow(0 5px 0 rgba(0, 0, 0, 0.16));
      }

      /* Each letter is its own sweet, painted stroke-first so the white
         outline sits outside the colour instead of eating into it. */
      .title span {
        color: var(--c);
        -webkit-text-stroke: 7px #fff;
        paint-order: stroke fill;
        animation: bob 2.4s ease-in-out infinite;
        animation-delay: var(--d);
      }

      @keyframes bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-7px); }
      }

      .tagline {
        font-size: 16px;
        font-weight: 800;
        color: #fff;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.28);
        margin-bottom: 10px;
        line-height: 1.4;
        max-width: 290px;
      }

      button {
        font-family: var(--font);
        font-weight: 900;
        border: none;
        cursor: pointer;
        color: #fff;
      }

      .big {
        position: relative;
        width: 100%;
        max-width: 310px;
        padding: 19px 24px;
        font-size: 22px;
        letter-spacing: 0.3px;
        border-radius: 26px;
        background: #0a7cff;
        box-shadow: 0 6px 0 #005fd6, 0 10px 18px rgba(0, 0, 0, 0.18);
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.18);
        overflow: hidden;
        transition: transform 0.08s, box-shadow 0.08s;
      }

      /* A gloss band across the top, the same trick the blocks use. */
      .big::after {
        content: "";
        position: absolute;
        inset: 4px 8px auto;
        height: 34%;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.26);
        pointer-events: none;
      }

      .big.alt {
        background: #4fd31a;
        box-shadow: 0 6px 0 #35a408, 0 10px 18px rgba(0, 0, 0, 0.18);
      }

      .big.warm {
        background: #ff7a00;
        box-shadow: 0 6px 0 #d65a00, 0 10px 18px rgba(0, 0, 0, 0.18);
      }

      /* Time attack. Red, because it is the one mode that is actively hostile. */
      .big.hot {
        background: #ff2d42;
        box-shadow: 0 6px 0 #d40a22, 0 10px 18px rgba(0, 0, 0, 0.18);
      }

      .big:active {
        transform: translateY(5px);
        box-shadow: 0 1px 0 #005fd6;
      }

      .big.alt:active { box-shadow: 0 1px 0 #35a408; }
      .big.warm:active { box-shadow: 0 1px 0 #d65a00; }
      .big.hot:active { box-shadow: 0 1px 0 #d40a22; }

      .big:disabled {
        background: #9fb6c4;
        box-shadow: 0 6px 0 #7e94a1;
      }

      .swatches {
        display: flex;
        gap: 14px;
        margin-top: 10px;
      }

      .swatch {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 4px solid rgba(255, 255, 255, 0.65);
        box-shadow: 0 3px 0 rgba(0, 0, 0, 0.16);
      }

      .swatch[aria-pressed="true"] {
        border-color: #fff;
        transform: scale(1.16);
      }

      .stats {
        display: flex;
        gap: 26px;
        margin: 2px 0 8px;
      }

      .stat b {
        display: block;
        font-size: 27px;
        color: #12384f;
      }

      .stat span {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.6px;
        color: #5b8aa6;
      }

      .best {
        font-size: 14px;
        font-weight: 800;
        color: #fff;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      }

      /* Quit and restart, in the top corners of the playable column — which is
         not the corners of the window once there is a tablet's worth of it. */
      .hud {
        position: absolute;
        top: calc(var(--safe-top) + 10px);
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        max-width: 680px;
        padding: 0 14px;
        display: flex;
        justify-content: space-between;
        pointer-events: none;
      }

      /* The menu's row has one button, and it belongs on the right. */
      .menu-hud {
        justify-content: flex-end;
      }

      .icon {
        pointer-events: auto;
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.7);
        color: #12384f;
        box-shadow: 0 3px 0 rgba(0, 0, 0, 0.14);
        transition: transform 0.08s, box-shadow 0.08s;
      }

      .icon svg {
        width: 21px;
        height: 21px;
      }

      .icon:active {
        transform: translateY(3px);
        box-shadow: 0 0 0 rgba(0, 0, 0, 0.14);
      }

      /* The level grid. Two columns on a phone, more when there is room. */
      .overlay.levels {
        justify-content: flex-start;
        overflow-y: auto;
        gap: 10px;
      }

      /*
       * The challenge code. Monospaced and wide-tracked because this is the one
       * string in the game a person has to read out, copy or type in by hand,
       * and a proportional font turns that into a chore.
       */
      .code-shown {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 21px;
        font-weight: 700;
        letter-spacing: 0.09em;
        padding: 12px 16px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.18);
        border: 2px dashed rgba(255, 255, 255, 0.4);
        user-select: all;
        -webkit-user-select: all;
      }

      .code-field {
        width: 100%;
        max-width: 320px;
        padding: 13px 15px;
        border: none;
        border-radius: 14px;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-align: center;
        color: #12384f;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.12);
      }

      .code-field::placeholder {
        color: #7fa0b4;
        letter-spacing: 0.02em;
      }

      .how-line {
        max-width: 380px;
        margin: 0;
        font-size: 14px;
        font-weight: 700;
        line-height: 1.45;
        opacity: 0.9;
      }

      .goal-line {
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        opacity: 0.82;
      }

      .level-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
        gap: 10px;
        width: 100%;
        max-width: 560px;
      }

      .level-tile {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 3px;
        min-height: 74px;
        padding: 11px 12px;
        border-radius: 18px;
        text-align: left;
        background: #0a7cff;
        box-shadow: 0 4px 0 #005fd6, 0 7px 14px rgba(0, 0, 0, 0.16);
        transition: transform 0.08s, box-shadow 0.08s;
      }

      .level-tile b {
        font-size: 21px;
        line-height: 1;
      }

      .level-tile span {
        font-size: 11px;
        font-weight: 800;
        line-height: 1.25;
        opacity: 0.88;
      }

      .level-tile:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 #005fd6;
      }

      .level-tile.done {
        background: #4fd31a;
        box-shadow: 0 4px 0 #35a408, 0 7px 14px rgba(0, 0, 0, 0.16);
      }

      .level-tile.done:active { box-shadow: 0 1px 0 #35a408; }

      .level-tile.locked {
        background: #9fb6c4;
        box-shadow: 0 4px 0 #7e94a1;
        opacity: 0.72;
      }

      /* The objective, pinned under the score for the whole level. */
      /*
       * Sits in a row the canvas reserves for it (GOAL_STRIP_ROW in
       * game-screen.ts) rather than floating over the header — overlaid, it ran
       * straight through the piece counter drawn in the middle of the header.
       * The two numbers must be changed together.
       */
      .goal-strip {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        top: calc(var(--safe-top) + 160px);
        display: flex;
        align-items: center;
        gap: 10px;
        max-width: min(92vw, 560px);
        padding: 7px 15px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.8);
        color: #12384f;
        font-size: 12px;
        font-weight: 800;
        /* One line, always. Wrapped, it grew into the board below it. */
        white-space: nowrap;
        pointer-events: none;
      }

      .goal-strip b { font-size: 13px; }
      .goal-text {
        opacity: 0.78;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .goal-count { font-variant-numeric: tabular-nums; }

      .goal-strip.met {
        background: #4fd31a;
        color: #fff;
      }

      .overlay.confirm {
        background: rgba(12, 40, 58, 0.42);
      }

      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 11px;
        width: 100%;
        max-width: 310px;
        padding: 26px 22px 22px;
        border-radius: 30px;
        background: #fff;
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.26);
      }

      .card-title {
        font-size: 27px;
        font-weight: 900;
        color: #12384f;
        letter-spacing: -0.4px;
      }

      /* Buttons inside a card are a size down from the menu's. */
      .card .big {
        max-width: 100%;
        padding: 14px 20px;
        font-size: 18px;
        border-radius: 20px;
      }

      .choice-label {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 1px;
        color: #5b8aa6;
        margin-top: 4px;
      }

      .choices {
        display: flex;
        gap: 8px;
        width: 100%;
      }

      .choice {
        flex: 1;
        padding: 12px 4px;
        font-size: 14px;
        border-radius: 16px;
        background: #e6eef4;
        color: #4a7a95;
        box-shadow: 0 3px 0 #cdd9e2;
      }

      .choice[aria-pressed="true"] {
        background: #0a7cff;
        color: #fff;
        box-shadow: 0 3px 0 #005fd6;
      }

      .confirm-body {
        font-size: 16px;
        font-weight: 700;
        line-height: 1.45;
        color: #12384f;
        max-width: 290px;
        margin-bottom: 8px;
      }

      .langs {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        margin-top: 12px;
      }

      .pill {
        padding: 9px 15px;
        font-size: 13px;
        letter-spacing: 0.5px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.28);
        box-shadow: 0 3px 0 rgba(0, 0, 0, 0.14);
      }

      .pill[aria-pressed="true"] {
        background: #fff;
        color: #12384f;
      }

      .pill.wide { background: rgba(255, 255, 255, 0.28); }

      .how-title {
        font-size: 34px;
        font-weight: 900;
        color: #12384f;
        letter-spacing: -0.5px;
      }

      .how {
        display: flex;
        flex-direction: column;
        gap: 16px;
        max-width: 320px;
        margin: 6px 0 14px;
      }

      .step {
        display: flex;
        gap: 14px;
        align-items: center;
        text-align: left;
      }

      .step b {
        flex: none;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: #0a7cff;
        color: #fff;
        font-size: 17px;
        display: grid;
        place-items: center;
        box-shadow: 0 3px 0 #005fd6;
      }

      .step p {
        font-size: 15px;
        font-weight: 700;
        line-height: 1.35;
        color: #12384f;
      }

      .card-preview {
        width: 100%;
        max-width: 300px;
        aspect-ratio: 1;
        border-radius: 26px;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.24);
      }

      .score-big {
        font-size: 68px;
        font-weight: 900;
        color: #12384f;
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="board"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
