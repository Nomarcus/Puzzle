<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#63CDFF" />
    <title>Shiftle</title>
    <style>
      :root {
        /* Parked here so the canvas layout can read them as plain numbers. */
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --font: "SF Pro Rounded", ui-rounded, -apple-system, system-ui, sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #2e9be8;
        font-family: var(--font);
        /* A puzzle game has nothing to select, and selection ruins dragging. */
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        touch-action: none;
      }

      #app {
        position: fixed;
        inset: 0;
      }

      #board {
        display: block;
        width: 100%;
        height: 100%;
      }

      .overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: calc(var(--safe-top) + 24px) 28px calc(var(--safe-bottom) + 24px);
        background: rgba(255, 255, 255, 0.82);
        backdrop-filter: blur(2px);
        text-align: center;
      }

      .overlay[hidden] {
        display: none;
      }

      .title {
        font-size: 54px;
        font-weight: 900;
        letter-spacing: -1.5px;
        color: #12384f;
      }

      .tagline {
        font-size: 16px;
        font-weight: 600;
        color: #5b8aa6;
        margin-top: -8px;
        margin-bottom: 12px;
        line-height: 1.45;
        max-width: 300px;
      }

      button {
        font-family: var(--font);
        font-weight: 800;
        border: none;
        cursor: pointer;
        color: #fff;
      }

      .big {
        width: 100%;
        max-width: 300px;
        padding: 18px 24px;
        font-size: 21px;
        border-radius: 22px;
        background: #0a7cff;
        box-shadow: 0 5px 0 #005fd6;
        transition: transform 0.08s, box-shadow 0.08s;
      }

      .big.alt {
        background: #4fd31a;
        box-shadow: 0 5px 0 #35a408;
      }

      .big:active {
        transform: translateY(4px);
        box-shadow: 0 1px 0 #005fd6;
      }

      .big.alt:active {
        box-shadow: 0 1px 0 #35a408;
      }

      .swatches {
        display: flex;
        gap: 12px;
        margin-top: 16px;
      }

      .swatch {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 4px solid rgba(0, 0, 0, 0.12);
      }

      .swatch[aria-pressed="true"] {
        border-color: #12384f;
      }

      .stats {
        display: flex;
        gap: 26px;
        margin: 4px 0 10px;
      }

      .stat b {
        display: block;
        font-size: 27px;
        color: #12384f;
      }

      .stat span {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.6px;
        color: #5b8aa6;
      }

      .score-big {
        font-size: 68px;
        font-weight: 900;
        color: #12384f;
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="board"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
